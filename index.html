<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Трекер привычек</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; background: #f7f7f8; color: #222; }
  h1 { font-size: 24px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input { flex: 1; padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 8px 12px; font-size: 16px; border: 0; border-radius: 6px; background: #4f46e5; color: #fff; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
  th, td { padding: 8px 4px; text-align: center; border-bottom: 1px solid #eee; font-size: 14px; }
  td:first-child, th:first-child { text-align: left; padding-left: 12px; }
  .cell { width: 28px; height: 28px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; padding: 0; }
  .cell.done { background: #22c55e; border-color: #22c55e; }
  .del { background: none; color: #999; font-size: 18px; padding: 0 8px; }
  .wrap { overflow-x: auto; }
</style>
</head>
<body>
<h1>Трекер привычек</h1>
<form id="form">
  <input id="name" placeholder="Новая привычка" required>
  <button>Добавить</button>
</form>
<div class="wrap"><table id="table"></table></div>

<script>
  const KEY = 'habits';
  let habits = JSON.parse(localStorage.getItem(KEY) || '[]');
  const save = () => localStorage.setItem(KEY, JSON.stringify(habits));

  // последние 7 дней
  const days = [...Array(7)].map((_, i) => {
    const d = new Date(); d.setDate(d.getDate() - 6 + i);
    return d.toLocaleDateString('sv'); // YYYY-MM-DD по локальному времени
  });

  function render() {
    const head = '<tr><th>Привычка</th>' +
      days.map(d => `<th>${d.slice(8)}.${d.slice(5, 7)}</th>`).join('') + '<th></th></tr>';
    const rows = habits.map((h, i) => '<tr><td>' + h.name.replace(/</g, '&lt;') + '</td>' +
      days.map(d => `<td><button class="cell ${h.done.includes(d) ? 'done' : ''}" data-i="${i}" data-d="${d}"></button></td>`).join('') +
      `<td><button class="del" data-del="${i}">×</button></td></tr>`).join('');
    document.getElementById('table').innerHTML = head + rows;
  }

  document.getElementById('form').onsubmit = e => {
    e.preventDefault();
    const input = document.getElementById('name');
    habits.push({ name: input.value.trim(), done: [] });
    input.value = '';
    save(); render();
  };

  document.getElementById('table').onclick = e => {
    const { i, d, del } = e.target.dataset;
    if (del !== undefined) { habits.splice(del, 1); }
    else if (d) {
      const done = habits[i].done;
      done.includes(d) ? done.splice(done.indexOf(d), 1) : done.push(d);
    } else return;
    save(); render();
  };

  render();
</script>
</body>
</html>
